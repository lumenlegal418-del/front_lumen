<app-header />
<app-navbar />

<main class="pagina">

 <!--<h1>Detalle De Ingresos y Egresos</h1>-->

<app-filters
  [filters]="filtros()"
  (apply)="onAplicarFiltros($event)"
  (clear)="onLimpiarFiltros($event)"
/>

  @if (errorRango()) {
    <p class="clientes-error">{{ errorRango() }}</p>
  }

  <section class="clientes-contenido">
    <app-table
      title=""
      [columns]="clientesColumns"
      [data]="clientesData()"
    />
  </section>
</main>
